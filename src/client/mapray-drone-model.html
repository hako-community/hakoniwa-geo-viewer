<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mapray-model-config" content="../../../config/mapray-drone-model.json">
  <title>Mapray 0.9.6 Drone Model Demo</title>
  <link rel="icon" href="data:,">
  <script src="https://resource.mapray.com/mapray-js/v0.9.6/mapray.min.js"></script>
  <script src="https://resource.mapray.com/ui/v0.9.6/maprayui.min.js"></script>
  <link rel="stylesheet" href="https://resource.mapray.com/styles/v1/mapray.css">
  <style>
    html, body, #mapray-container { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #mapray-model-panel {
      position: absolute; z-index: 1000; top: 12px; left: 12px; max-width: 520px;
      padding: 12px 14px; border: 1px solid #5fd5ff; border-radius: 6px;
      color: #eefaff; background: rgba(3, 15, 28, 0.9); font: 13px/1.45 sans-serif;
      white-space: pre-wrap;
    }
    #mapray-model-panel[data-state="ready"] { border-color: #50e3a4; }
    #mapray-model-panel[data-state="blocked"],
    #mapray-model-panel[data-state="error"] { border-color: #ffb454; }
    #mapray-model-controls { position: absolute; z-index: 1000; top: 12px; right: 12px; }
    #mapray-model-controls { display: flex; gap: 8px; }
    #reset-model-view, #toggle-rotor-animation, #toggle-model-follow,
    #fixture-model-pose, #fixture-fleet-size {
      padding: 9px 12px; border: 1px solid #5fd5ff; border-radius: 5px;
      color: #eefaff; background: rgba(3, 15, 28, 0.9); cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="mapray-container"></div>
  <div id="mapray-model-panel" data-state="loading">Mapray 0.9.6 Drone Modelを初期化中...</div>
  <div id="mapray-model-controls">
    <select id="fixture-fleet-size" aria-label="機体数">
      <option value="1">1機</option>
      <option value="5">5機</option>
      <option value="10">10機</option>
    </select>
    <select id="fixture-model-pose" aria-label="基準姿勢">
      <option value="flight">編隊飛行</option>
      <option value="level">水平・北向き</option>
      <option value="yaw90">Yaw +90°（西向き）</option>
      <option value="yaw180">Yaw 180°（南向き）</option>
      <option value="roll10">Roll +10°</option>
      <option value="pitch10">Pitch +10°</option>
    </select>
    <button id="toggle-rotor-animation" type="button">回転を停止（基準角）</button>
    <button id="toggle-model-follow" type="button">機体を追従</button>
    <button id="reset-model-view" type="button">初期視点へ戻る</button>
  </div>
  <script id="mapray-drone-diagnostics" type="application/json">{}</script>
  <script type="module" src="./src/mapray_drone_model_demo.js?v=phase6-20260913-1"></script>
</body>
</html>
